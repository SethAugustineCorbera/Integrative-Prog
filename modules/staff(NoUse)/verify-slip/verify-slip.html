<!DOCTYPE html>

<body>
<div class="app">

<header class="topbar"><span id="role-label"></span><a class="btn btn-outline" href="../../../index.html#login">Log out</a></header>
<section class="content">
<h1>Verify slip</h1>
<p class="muted">Check a student's clearance slip code through the Hub.</p>
<form id="verify-form" class="card">
<div class="form-row"><label for="slip-code-input">Signed short code</label><input type="text" id="slip-code-input" maxlength="24" autocomplete="off"></div>
<div class="form-row"><label for="slip-token-input">Or signed token</label><input type="text" id="slip-token-input" maxlength="512" autocomplete="off"></div>
<button class="btn" type="submit">Verify slip</button>
</form>
<h2>Verification result</h2>
<div class="table-wrap">
<table>
<thead><tr><th>Check</th><th>Result</th></tr></thead>
<tbody>
</tbody>
</table>

</main>
</div>
